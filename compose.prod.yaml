services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile-ui
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    # No `environment:` entry for VITE_API_URL here on purpose: it's baked into
    # the static JS bundle at build time (see docker/Dockerfile-ui), so setting
    # it as a runtime container env var would silently do nothing.
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile-backend
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      HISTORY_GCS_URI: ${HISTORY_GCS_URI:-}
      HISTORY_LOCAL_PATH: ${HISTORY_LOCAL_PATH:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      MAX_HISTORY_PAIRS: ${MAX_HISTORY_PAIRS:-10}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/terraform/backend-sa-key.json
    # Mounts the whole `terraform/` dir (not just the key file) so `up` never
    # fails to start even if the key hasn't been generated on this machine —
    # any resulting failure surfaces later, clearly, inside our own GCS code.
    volumes:
      - ./terraform:/secrets/terraform:ro
    # No `ports:` entry on purpose: backend is reachable only from nginx over
    # the internal Compose network, never directly from the host/internet.
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No `ports:` entry on purpose: redis is reachable only from the backend
    # over the internal Compose network, never directly from the host/internet.
    restart: unless-stopped
