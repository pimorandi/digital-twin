services:
  frontend:
    profiles: ["prod", "test"]
    build:
      context: .
      dockerfile: docker/Dockerfile-ui
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    # No `VITE_API_URL` entry here on purpose: it's baked into the static JS
    # bundle at build time (see docker/Dockerfile-ui), so setting it as a
    # runtime container env var would silently do nothing. BACKEND_UPSTREAM is
    # different — nginx's config is templated (docker/nginx.conf.template) and
    # reads it at container start, so it's a genuine runtime var: "backend" is
    # Compose's service-name DNS; Cloud Run's sidecar deployment sets this to
    # 127.0.0.1 instead (localhost networking), same image either way.
    environment:
      BACKEND_UPSTREAM: backend
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    profiles: ["prod", "test"]
    build:
      context: .
      dockerfile: docker/Dockerfile-backend
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      HISTORY_GCS_URI: ${HISTORY_GCS_URI:-}
      HISTORY_LOCAL_PATH: ${HISTORY_LOCAL_PATH:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      MAX_HISTORY_PAIRS: ${MAX_HISTORY_PAIRS:-10}
      CHAT_LOG_GCS_URI: ${CHAT_LOG_GCS_URI:-}
    # No credentials here on purpose: this is the prod shape, matching what
    # ships to Cloud Run, where the attached service account provides ADC
    # automatically (no JSON key). Local testing adds the key back via
    # compose.test.yaml — see CLAUDE.md's "Local development" section.
    # No `ports:` entry on purpose: backend is reachable only from nginx over
    # the internal Compose network, never directly from the host/internet.
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    profiles: ["prod", "test"]
    image: redis:7-alpine
    # No `ports:` entry on purpose: redis is reachable only from the backend
    # over the internal Compose network, never directly from the host/internet.
    restart: unless-stopped
