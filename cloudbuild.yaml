substitutions:
  _REGION: us-central1
  _REPO: digital-twin
  # Public Turnstile site key (baked into the frontend bundle). Set at submit time:
  #   gcloud builds submit --substitutions=_TURNSTILE_SITE_KEY=<key>
  _TURNSTILE_SITE_KEY: ""

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-f",
        "docker/Dockerfile-ui",
        "--build-arg",
        "VITE_TURNSTILE_SITE_KEY=${_TURNSTILE_SITE_KEY}",
        "-t",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:latest",
        ".",
      ]
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-f",
        "docker/Dockerfile-backend",
        "-t",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:latest",
        ".",
      ]

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:latest"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:latest"
